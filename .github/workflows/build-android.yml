name: Build Android APK

on:
  push:
    paths:
      - 'android-broadcaster/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android-broadcaster/**/*.gradle*') }}

      - name: Install Gradle 8.4
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.4-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/gradle
          echo "/opt/gradle/gradle-8.4/bin" >> $GITHUB_PATH

      - name: Generate Gradle Wrapper
        working-directory: android-broadcaster
        run: gradle wrapper --gradle-version=8.4

      - name: Build debug APK
        working-directory: android-broadcaster
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orbitalis-broadcaster-debug
          path: android-broadcaster/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
